name: CI

# Everything the release workflow builds, minus the signing keys and publishing, so a version tag
# never fails on something a push could have caught.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build and test Android
        working-directory: android
        run: ./gradlew --no-daemon test assembleRelease

      - name: Test Mac
        working-directory: mac
        run: swift test

      - name: Build Mac app (universal, ad-hoc signed)
        working-directory: mac
        env:
          COPIER_SIGN_IDENTITY: "-"
          COPIER_UNIVERSAL: "1"
        run: ./scripts/build-app.sh

      - name: Installer parses under the bash that macOS ships (3.2)
        run: /bin/bash -n install.sh
