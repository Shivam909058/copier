name: CI

# Everything the release workflow builds, minus the signing keys and publishing, so a version tag
# never fails on something a push could have caught.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle  # fewer downloads from Maven Central, which rate-limits shared runners

      - name: Build and test Android
        working-directory: android
        run: |
          # Maven Central answers shared runners with HTTP 429 now and then. Whatever did download
          # is kept between attempts, so a retry after a pause gets through.
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon test assembleRelease; then exit 0; fi
            echo "::warning::Gradle failed (attempt $attempt of 3)"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 45)); fi
          done
          exit 1

      - name: Test Mac
        working-directory: mac
        run: swift test

      - name: Build Mac app (universal, ad-hoc signed)
        working-directory: mac
        env:
          COPIER_SIGN_IDENTITY: "-"
          COPIER_UNIVERSAL: "1"
        run: ./scripts/build-app.sh

      - name: Installer parses under the bash that macOS ships (3.2)
        run: /bin/bash -n install.sh
